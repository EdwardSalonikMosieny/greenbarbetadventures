# Nginx site config for Green Barbet Adventures.
# Installed by setup-vps.sh into /etc/nginx/sites-available/__DOMAIN__
# with __DOMAIN__ and __APP_DIR__ substituted at provisioning time.
#
# certbot --nginx will edit this file in place to add the SSL server block
# and HTTP->HTTPS redirect — do not hand-edit the SSL parts after that runs.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root __APP_DIR__/frontend/dist;
    index index.html;

    # React Router client-side routing — fall back to index.html for any
    # route that isn't a real static file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Express backend running under PM2.
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr is restored from CF-Connecting-IP only when the socket
        # peer is in Cloudflare's trusted CIDRs (configured by setup-vps.sh).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Do not let edge or intermediary cache rules persist JWTs or customer PII.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # Uploaded admin images (multer), served by the backend.
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Long cache for hashed, immutable Vite build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 10M;
}
