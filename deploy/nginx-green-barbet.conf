# Nginx site config for the Green Barbet Adventures API.
# Installed by setup-vps.sh into /etc/nginx/sites-available/__DOMAIN__
# with __DOMAIN__ substituted at provisioning time (__DOMAIN__ = the API
# subdomain, e.g. api.greenbarbetadventures.com — the frontend is served
# separately from hosting.com, not from this box).
#
# certbot --nginx will edit this file in place to add the SSL server block
# and HTTP->HTTPS redirect — do not hand-edit the SSL parts after that runs.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Proxy API requests to the Express backend running under PM2.
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded admin images (multer), served by the backend.
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    client_max_body_size 10M;
}
