name: Deploy to Production

# Push to main -> test both apps -> rsync the repo to the VPS -> rebuild and
# reload both PM2 processes. See deploy/README.md for the one-time server and
# secret setup this depends on.
#
# This is a monorepo, so a single workflow deploys the API and the site
# together; the sibling Salama/Johjam projects split these across two repos.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ENVIRONMENT: production
  SSH_HOST: ${{ secrets.SSH_HOST }}
  SSH_PORT: ${{ secrets.SSH_PORT }}
  SSH_USER: ${{ secrets.SSH_USER }}
  APP_DEPLOY_PATH: ${{ secrets.APP_DEPLOY_PATH }}
  BACKEND_PORT: 3070
  FRONTEND_PORT: 5070

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts resolves DATABASE_URL eagerly, so `prisma generate`
      # fails without one even though it never opens a connection. CI has no
      # .env, so a throwaway value is supplied here. Nothing in this job talks
      # to a database — the tests inject fakes rather than query one — so this
      # string is never dialled. The real credentials live only on the server.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # --- Backend ---
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./backend
        run: npm run prisma:generate

      - name: Lint backend
        working-directory: ./backend
        run: npm run lint

      - name: Test backend
        working-directory: ./backend
        run: npm test

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      # --- Frontend ---
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # --- Both ---
      - name: Security audit
        run: |
          npm audit --prefix backend --omit=dev || true
          npm audit --prefix frontend --omit=dev || true

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Validate required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_DEPLOY_PATH: ${{ secrets.APP_DEPLOY_PATH }}
        run: |
          missing=0
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY APP_DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Aborting deploy — set the missing repository secrets and re-run."
            exit 1
          fi
          echo "All required secrets are present."

      - uses: actions/checkout@v4

      - name: Create deployment record
        run: |
          echo "Deploying commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
          echo "Timestamp: $(date -u)"

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            # Preferred: the host key is pinned in a repo secret, so a swapped
            # or spoofed host fails the connection instead of being trusted.
            echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
            echo "Using pinned host key from SSH_KNOWN_HOSTS."
          else
            # Fallback: no pinned key available, so scan the host at run time.
            # This is trust-on-first-use for every run and does NOT protect
            # against a man-in-the-middle. Populate SSH_KNOWN_HOSTS with the
            # output below to close that gap — see deploy/README.md.
            echo "::warning::SSH_KNOWN_HOSTS is not set — falling back to ssh-keyscan (trust-on-first-use, no MITM protection)."
            # Scanned once, into a variable: scanning a second time just to print
            # the keys made a transient network failure fatal under `bash -e`.
            # Left unhashed so the output can be pasted straight into the secret.
            scanned=$(ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" 2>/dev/null || true)
            if [ -z "$scanned" ]; then
              echo "::error::ssh-keyscan returned no host keys for ${SSH_HOST}:${SSH_PORT}."
              exit 1
            fi
            printf '%s\n' "$scanned" >> ~/.ssh/known_hosts
            echo "Scanned host keys (add these to the SSH_KNOWN_HOSTS secret):"
            printf '%s\n' "$scanned"
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Open the shared SSH connection
        run: |
          # Everything after this reuses ONE SSH connection via ControlMaster:
          # rsync, the deploy script and the health checks all multiplex over the
          # same socket, so the server sees a single session and a single auth.
          # The alias also keeps host, port and user out of every later command.
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${SSH_HOST}
            Port ${SSH_PORT}
            User ${SSH_USER}
            AddressFamily inet
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 10m
            ServerAliveInterval 30
            ServerAliveCountMax 3
            ConnectTimeout 30
          EOF
          chmod 600 ~/.ssh/config

          echo "SSH target address candidates:"
          getent ahosts "${SSH_HOST}" || true

          # Establish the master connection up front so a failure here is
          # reported as a connection problem rather than a deploy problem.
          ssh -N -f deploy-target
          ssh -O check deploy-target

      - name: Deploy to production
        run: |
          if [ -z "${APP_DEPLOY_PATH}" ]; then
            echo "::error::APP_DEPLOY_PATH is empty — refusing to rsync --delete (it would target the home directory and wipe it)."
            exit 1
          fi

          retry() {
            local label="$1"; shift
            local max=3 delay=10 attempt=1
            until "$@"; do
              if [ $attempt -ge $max ]; then
                echo "${label} failed after $max attempts"
                return 1
              fi
              echo "${label} attempt $attempt/$max failed, retrying in ${delay}s..."
              attempt=$((attempt + 1))
              sleep $delay
            done
          }

          retry rsync rsync -az --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude "backend/dist" \
            --exclude "backend/uploads" \
            --exclude "frontend/dist" \
            --exclude "logs" \
            --exclude ".env" \
            --exclude ".env.production" \
            -e ssh \
            ./ \
            "deploy-target:${APP_DEPLOY_PATH}/"

          # One remote shell for the whole build-and-reload sequence, rather than
          # a connection per command. `set -e` stops it at the first failure, so
          # a broken build never reaches pm2 and the running site is left alone.
          #
          # Backend dev dependencies stay installed: the TypeScript build and the
          # Prisma CLI both live there, so `--omit=dev` would break the deploy and
          # `prisma:create-admin`. The process is not internet-facing — the proxy is.
          #
          # `cd` before each pm2 call is load-bearing: PM2 resolves an app's
          # relative script and log paths against the cwd of the pm2 command, not
          # against the ecosystem file's own location.
          retry "remote deploy" ssh deploy-target "
            set -e
            cd '${APP_DEPLOY_PATH}'
            mkdir -p logs backend/uploads

            cd backend
            npm ci
            # backend/package.json regenerates the Prisma client on postinstall,
            # but this is repeated explicitly because npm ci deletes the client
            # (it lives in node_modules) and a stub one fails the build in a way
            # that is not obviously about Prisma at all.
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 startOrReload ecosystem.config.production.json --only greenbarbet-prod --update-env

            cd ../frontend
            npm ci
            npm run build
            pm2 startOrReload ecosystem.config.production.json --only greenbarbet-web-prod --update-env

            pm2 save
          "

      - name: Health check
        run: |
          sleep 10
          RETRY_COUNT=0
          MAX_RETRIES=5

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # Both ports checked in a single remote shell, so one attempt is one
            # round trip. 401 counts as healthy for the API: it means Express is
            # answering and the auth middleware is doing its job.
            RESULT=$(ssh deploy-target "
              api=\$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:${BACKEND_PORT}/api/v1/health || echo 000)
              web=\$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:${FRONTEND_PORT}/ || echo 000)
              echo \"\${api} \${web}\"
            " 2>/dev/null || echo "000 000")

            API_CODE=$(echo "$RESULT" | awk '{print $1}')
            WEB_CODE=$(echo "$RESULT" | awk '{print $2}')

            API_OK=false; WEB_OK=false
            { [ "$API_CODE" = "200" ] || [ "$API_CODE" = "401" ]; } && API_OK=true
            [ "$WEB_CODE" = "200" ] && WEB_OK=true

            if $API_OK && $WEB_OK; then
              echo "✓ API (${API_CODE}) and site (${WEB_CODE}) both healthy"
              exit 0
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Health check attempt $RETRY_COUNT/$MAX_RETRIES — API: ${API_CODE}, site: ${WEB_CODE}"

            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              sleep 5
            fi
          done

          echo "✗ Health check failed after $MAX_RETRIES attempts (API: ${API_CODE}, site: ${WEB_CODE})"
          exit 1

      - name: Close the shared SSH connection
        if: always()
        run: ssh -O exit deploy-target 2>/dev/null || true

      - name: Notify Success
        if: success()
        run: |
          echo "✓ Production deployment successful"
          echo "Commit: ${{ github.sha }}"
          echo "Time: $(date -u)"
