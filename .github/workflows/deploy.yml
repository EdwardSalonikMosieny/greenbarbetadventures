name: Deploy to VPS

# Runs automatically on every push to main — this is the "push to GitHub and
# it goes live" piece. See deploy/README.md for the one-time setup needed
# before this will work (SSH key + repo secrets).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            APP_DIR="/var/www/green-barbet-adventures"
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            cd "$APP_DIR/backend"
            npm ci
            npx prisma migrate deploy
            npm run build
            pm2 restart gba-backend

            cd "$APP_DIR/frontend"
            npm ci
            npm run build

            sudo nginx -t && sudo systemctl reload nginx
